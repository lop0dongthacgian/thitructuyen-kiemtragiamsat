<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê thí sinh làm nhiều bài</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#ddd8cc;--keep:#1f7a4d;--keepbg:#e3f3ea;--drop:#b3261e;--dropbg:#fbe7e5;--warn:#9a6700;--warnbg:#fff3d1;--btn:#1d2433;--btnink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--ink:#eceef3;--mute:#9aa3b5;--line:#343a49;--keep:#6fd3a0;--keepbg:#173626;--drop:#ff9a92;--dropbg:#42201e;--warn:#f2c14e;--warnbg:#3a2f12;--btn:#eceef3;--btnink:#14171f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding:16px;max-width:760px;margin:0 auto;text-align:center}
h1{font-size:1.45rem;margin:8px 0 6px}
h2{font-size:1.05rem;margin:22px 0 4px}
p.lead{color:var(--mute);margin:0 auto 16px;max-width:52ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:0 0 4px}
input[type=file]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=file]{text-align:center}
button{font:inherit;font-weight:600;background:var(--btn);color:var(--btnink);border:0;border-radius:8px;padding:10px 14px;margin-top:6px;cursor:pointer}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.sum{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center}
.sum b{font-size:1.4rem;display:block;line-height:1.1}
.sum span{color:var(--mute);font-size:.88rem}
.grp h3{margin:0 0 2px;font-size:1.02rem}
.meta{color:var(--mute);font-size:.88rem;margin-bottom:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:700;font-size:.8rem}
.k{background:var(--keepbg);color:var(--keep)}.d{background:var(--dropbg);color:var(--drop)}
.w{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:4px 8px;margin:0 0 8px;font-size:.88rem}
.err{background:var(--dropbg);color:var(--drop);padding:10px;border-radius:8px}
.note{color:var(--mute);font-size:.86rem;margin:0 auto 10px;max-width:56ch}
</style>
</head>
<body>
<h1>Thống kê thí sinh làm nhiều bài</h1>
<p class="lead">Chọn tệp sao lưu sheet KetQuaThi (.xlsx hoặc .csv). Công cụ chỉ thống kê và đánh dấu, không sửa dữ liệu, và chạy ngay trên máy bạn. Với người làm nhiều bài, bài gửi sớm nhất được công nhận.</p>

<div class="card">
  <label for="f">Tệp sao lưu KetQuaThi</label>
  <input id="f" type="file" accept=".xlsx,.xls,.csv">
</div>

<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
let ROWS = [], LAST = null;

const norm = s => String(s == null ? '' : s).normalize('NFC').replace(/\s+/g,' ').trim().toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseTime(s){
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)).getTime() : NaN;
}
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? NaN : n; };
const T = x => isNaN(x) ? Infinity : x;

$('f').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    $('out').innerHTML = '<div class="err">Chưa tải được thư viện đọc Excel. Hãy bật mạng rồi mở lại tệp này.</div>';
    return;
  }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const wb = XLSX.read(rd.result, {type:'array'});
      const name = wb.SheetNames.find(n => n.toLowerCase() === 'ketquathi') || wb.SheetNames[0];
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:false, defval:''});
      ROWS = [];
      aoa.slice(1).forEach((r, i) => {
        if (!norm(r[1])) return;
        ROWS.push({row:i+2, ten:String(r[1]).trim(), nam:String(r[2]).trim(), cb:String(r[3]).trim(), de:String(r[4]).trim(),
                   diem:num(r[5]), tg:num(r[7]), gio:String(r[11]).trim(), t:parseTime(r[11])});
      });
      if (!ROWS.length) throw new Error('Không thấy dòng dữ liệu nào ở cột B (Họ và tên).');
      render();
    } catch (err) {
      $('out').innerHTML = '<div class="err">Không đọc được tệp: ' + esc(err.message) + '</div>';
    }
  };
  rd.readAsArrayBuffer(file);
});

function sortTime(list){ return list.slice().sort((a,b) => T(a.t) - T(b.t) || a.row - b.row); }
function orderDiff(list){ const a = sortTime(list), b = list.slice().sort((x,y) => x.row - y.row); return a.some((r,i) => r.row !== b[i].row); }

function analyse(){
  const byPerson = new Map();
  ROWS.forEach(r => {
    const k = norm(r.ten) + '|' + norm(r.cb);
    if (!byPerson.has(k)) byPerson.set(k, []);
    byPerson.get(k).push(r);
  });
  const same = [], suspect = [];
  byPerson.forEach(list => {
    const byYear = new Map();
    list.forEach(r => { const y = norm(r.nam); if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(r); });
    byYear.forEach(l => { if (l.length > 1) same.push({list:sortTime(l)}); });
    if (byYear.size > 1) suspect.push({list:sortTime(list), years:byYear});
  });
  const by = (a,b) => b.list.length - a.list.length || a.list[0].ten.localeCompare(b.list[0].ten, 'vi');
  return {same:same.sort(by), suspect:suspect.sort(by)};
}

function table(list, firstOf){
  let h = '<div class="tbl"><table><tr><th>Dòng</th><th>Năm sinh</th><th>Bộ đề</th><th>Đúng</th><th>Làm (giây)</th><th>Giờ nộp</th><th>Đánh dấu</th></tr>';
  list.forEach(r => {
    const k = firstOf(r) === r;
    h += '<tr><td>' + r.row + '</td><td>' + esc(r.nam) + '</td><td>' + esc(r.de) + '</td><td>' + (isNaN(r.diem) ? '' : r.diem) + '</td><td>' +
         (isNaN(r.tg) ? '' : r.tg) + '</td><td>' + esc(r.gio) + '</td><td><span class="tag ' + (k ? 'k">Công nhận' : 'd">Nộp lại') + '</span></td></tr>';
  });
  return h + '</table></div>';
}

function render(){
  const res = analyse(); LAST = res;
  const extra = res.same.reduce((s,g) => s + g.list.length - 1, 0);
  let h = '<div class="card sum"><div><b>' + ROWS.length + '</b><span>bài trong tệp</span></div><div><b>' + res.same.length +
          '</b><span>người làm nhiều bài</span></div><div><b>' + extra + '</b><span>lượt nộp lại</span></div><div><b>' + res.suspect.length +
          '</b><span>nhóm cần xem (khác năm sinh)</span></div></div>';

  h += '<h2>Cùng họ tên, chi bộ và năm sinh</h2><p class="note">Coi là một người. Bài gửi sớm nhất được công nhận, các lượt sau đánh dấu là nộp lại.</p>';
  if (!res.same.length) h += '<div class="card">Không có trường hợp nào.</div>';
  res.same.forEach(g => {
    const f = g.list[0];
    h += '<div class="card grp"><h3>' + esc(f.ten) + '</h3><div class="meta">' + esc(f.cb) + ', sinh ' + esc(f.nam) + ', ' + g.list.length + ' lượt nộp</div>';
    if (orderDiff(g.list)) h += '<div class="w">Thứ tự theo giờ nộp khác thứ tự dòng. Hãy đối chiếu giờ gốc ở cột A của DuPhong_x.</div>';
    h += table(g.list, () => f) + '</div>';
  });

  h += '<h2>Cùng họ tên và chi bộ nhưng khác năm sinh</h2><p class="note">Có thể là hai người khác nhau hoặc nhập sai năm sinh. Chỉ để xét khi cần, mỗi năm sinh được đánh dấu riêng.</p>';
  if (!res.suspect.length) h += '<div class="card">Không có trường hợp nào.</div>';
  res.suspect.forEach(g => {
    const f = g.list[0], first = new Map();
    g.years.forEach((l, y) => first.set(y, sortTime(l)[0]));
    h += '<div class="card grp"><h3>' + esc(f.ten) + '</h3><div class="meta">' + esc(f.cb) + ', ' + g.years.size + ' năm sinh khác nhau, ' + g.list.length + ' lượt nộp</div>' +
         table(g.list, r => first.get(norm(r.nam))) + '</div>';
  });
  h += '<div class="card"><button id="csv">Tải bảng thống kê (.xlsx)</button></div>';
  $('out').innerHTML = h;
  $('csv').onclick = download;
}

function download(){
  if (typeof XLSX === 'undefined') { alert('Chưa tải được thư viện Excel. Hãy bật mạng rồi thử lại.'); return; }
  const head = ['Nhóm','Dòng','Họ và tên','Năm sinh','Chi bộ','Bộ đề','Số câu đúng','Thời gian làm bài (giây)','Thời gian nộp','Đánh dấu'];
  const sheet = (groups, firstOf) => {
    const aoa = [head];
    groups.forEach((g, i) => g.list.forEach(r => aoa.push([i+1, r.row, r.ten, r.nam, r.cb, r.de,
      isNaN(r.diem) ? '' : r.diem, isNaN(r.tg) ? '' : r.tg, r.gio, firstOf(g, r) === r ? 'Công nhận' : 'Nộp lại'])));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [6,6,26,10,30,14,12,16,22,12].map(w => ({wch:w}));
    return ws;
  };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(LAST.same, g => g.list[0]), 'Cung nam sinh');
  XLSX.utils.book_append_sheet(wb, sheet(LAST.suspect, (g, r) => sortTime(g.years.get(norm(r.nam)))[0]), 'Khac nam sinh');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = 'thong-ke-lam-nhieu-bai.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
